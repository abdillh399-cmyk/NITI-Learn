{% extends "base.html" %}{% block content %}<form class="panel" method="post" enctype="multipart/form-data"><h1>Upload lesson</h1><label>Title<input name="title" required></label><label>Description<textarea name="description"></textarea></label><label>Term<select name="term">{% for x in terms %}<option>{{x}}</option>{% endfor %}</select></label><label>Level<select name="level">{% for x in levels %}<option>{{x}}</option>{% endfor %}</select></label><label>Unit<select name="unit">{% for x in units %}<option>{{x}}</option>{% endfor %}</select></label><label>Video<input name="video_file" type="file" accept="video/*" required></label><button>Upload</button></form>{% endblock %}
