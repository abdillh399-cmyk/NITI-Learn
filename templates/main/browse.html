{% extends "base.html" %}{% block content %}<h1>Browse lessons</h1><form class="filters"><select name="term"><option value="">All terms</option>{% for x in terms %}<option {% if x==current_term %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="level"><option value="">All levels</option>{% for x in levels %}<option {% if x==current_level %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="unit"><option value="">All units</option>{% for x in units %}<option {% if x==current_unit %}selected{% endif %}>{{x}}</option>{% endfor %}</select><button>Filter</button></form><div class="grid">{% for v in pagination.items %}<a class="card" href="{{url_for('videos.detail',video_id=v.id)}}"><div class="thumb">▶</div><h3>{{v.title}}</h3><p>{{v.term}} · {{v.level}} · {{v.unit}}</p></a>{% else %}<p>No matching videos.</p>{% endfor %}</div>{% endblock %}
