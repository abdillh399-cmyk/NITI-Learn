{% extends "base.html" %}{% block content %}<h1>{{current_user.username}}</h1><p>{{current_user.email}}</p><h2>Your videos</h2><div class="grid">{% for v in videos %}<a class="card" href="{{url_for('videos.detail',video_id=v.id)}}"><h3>{{v.title}}</h3><p>{{v.term}} · {{v.level}}</p></a>{% else %}<p>You have not uploaded a video yet.</p>{% endfor %}</div>{% endblock %}
